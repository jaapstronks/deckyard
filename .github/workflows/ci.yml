name: CI

on:
  push:
    branches: [main, collab]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The export chain (PDF, PNG, PPTX, deck thumbnails, sandbox OG image)
      # drives headless Chrome, and puppeteer-core deliberately ships without a
      # browser — which is exactly why that chain went untested for so long.
      # Install the Chrome build the installed puppeteer-core pins, so a
      # puppeteer bump is exercised against the browser it expects. That
      # pairing is what tests/export-chrome-smoke.test.js guards.
      # Rationale and alternatives: docs/developer/export-smoke-test.md.
      - name: Install Chrome for the export smoke test
        run: |
          set -euo pipefail
          CHROME_VERSION="$(node -e "import('puppeteer-core').then(m => console.log(m.PUPPETEER_REVISIONS.chrome))")"
          echo "Installing Chrome $CHROME_VERSION (pinned by puppeteer-core)"
          # @puppeteer/browsers ships as a puppeteer-core dependency, so this
          # needs no extra package and no third-party action.
          INSTALL_LOG="$(npx --no-install @puppeteer/browsers install "chrome@$CHROME_VERSION" --path "$RUNNER_TEMP/chrome")"
          CHROME_PATH="$(printf '%s\n' "$INSTALL_LOG" | tail -n1 | cut -d' ' -f2-)"
          test -x "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm test

  # Second run of the SAME suite, with a fork slide type dropped into
  # custom/slide-types/ before it starts. That tree is gitignored, so upstream CI
  # otherwise only ever sees the core registry — and a derivation that takes one
  # branch fewer for a type that does NOT declare something (an inspectorKeeps
  # list, its own i18n keys) is invisible until a fork installs one. It bit twice
  # in two days, both caught only at review: #499 (i18n prune wiped fork
  # translations) and #501 (inspector audit demanded the injected bg/a11y fields
  # of a keepless type). This job makes that branch a first-class citizen of CI.
  #
  # A separate job, not a matrix arm of `test`, on purpose: a red mark here reads
  # as "the fork branch broke", not "a test broke", without opening the run.
  # Fixtures live tracked under tests/fixtures/fork-slide-types/ and are copied
  # in, so a local `npm test` (no copy) still runs the pure core suite.
  test-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same Chrome provisioning as `test`: the fork run is the whole suite, and
      # the export smoke test refuses to skip under CI (see
      # tests/export-chrome-smoke.test.js). Kept in step with the block above.
      - name: Install Chrome for the export smoke test
        run: |
          set -euo pipefail
          CHROME_VERSION="$(node -e "import('puppeteer-core').then(m => console.log(m.PUPPETEER_REVISIONS.chrome))")"
          echo "Installing Chrome $CHROME_VERSION (pinned by puppeteer-core)"
          INSTALL_LOG="$(npx --no-install @puppeteer/browsers install "chrome@$CHROME_VERSION" --path "$RUNNER_TEMP/chrome")"
          CHROME_PATH="$(printf '%s\n' "$INSTALL_LOG" | tail -n1 | cut -d' ' -f2-)"
          test -x "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Load fork slide types into custom/slide-types/
        run: cp tests/fixtures/fork-slide-types/*.js custom/slide-types/
      - run: npm test

  # The committed client/vendor/ tree, against what the vendor scripts produce
  # from the lockfile. The browser loads the *committed* copies, so a dependency
  # bump without a re-vendor ships the old code — an XSS-patched dompurify in
  # package-lock.json while client/vendor/dompurify/ still serves the vulnerable
  # build (#693; same pattern earlier with katex/prismjs in #570). The `test`
  # job cannot catch this: its `npm ci` runs postinstall, which regenerates the
  # vendored copies in the runner's working tree *before* the suite starts, so
  # the staleness is masked exactly where it would have been observed — and
  # vendor:collab is not in postinstall at all, so the collab bundle is never
  # even regenerated there.
  #
  # This job makes the masking step the check itself: run `npm ci` (postinstall
  # re-vendors lucide/dompurify/prism-katex) plus `npm run vendor:collab`
  # (esbuild pinned in devDependencies, so the output is reproducible from the
  # lockfile), then fail if the committed tree changed. A dep bump of a vendored
  # package is green only when the PR re-vendors.
  #
  # A separate job, like the others, so a red mark reads as "the vendored
  # copies are stale — run the vendor scripts and commit" without opening the
  # run.
  vendor-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor:collab
      - name: Committed client/vendor tree must match what the scripts produce
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- client/vendor)" ]; then
            echo "::error::client/vendor/ is stale: regenerating from the lockfile changed it."
            echo "Run: npm ci && npm run vendor:collab — then commit the client/vendor/ changes."
            git status -- client/vendor
            git diff --stat -- client/vendor
            exit 1
          fi

  # The migrations, against a real PostgreSQL. Until this job existed, none of
  # them ran anywhere in CI: one is exercised individually against the in-memory
  # double (tests/helpers/fake-db.js) and the rest ran for the first time on
  # staging or production — a deploy was the first place a broken migration
  # could be found. It ran once here and immediately found one (020's `down`
  # named a column that has never existed).
  #
  # Deliberately narrow: up → down-all → up against an empty database, and
  # nothing else. No test directory, no fixtures, no storage-layer queries. That
  # is option D in docs/plans/briefs/postgres-test-infra.md; the full
  # `services: postgres` test job (option A) is the follow-up.
  #
  # A separate job, like `test-fork`, so it costs ~0 wall-clock on the critical
  # path — GitHub runs it beside `test`, not behind it — and so a red mark reads
  # as "a migration broke" without opening the run.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deckyard
          POSTGRES_PASSWORD: deckyard
          POSTGRES_DB: deckyard_migration_smoke
        ports:
          - 5432:5432
        # The runner starts the step as soon as the container is up, which is
        # earlier than the server accepting connections. Without the healthcheck
        # the first migration loses a race it will never lose twice.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run every migration up, all the way down, and up again
        run: node scripts/migration-smoke-test.js
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: deckyard_migration_smoke
          DATABASE_USER: deckyard
          DATABASE_PASSWORD: deckyard
          DATABASE_SSL: 'false'
      # Second, on the schema the step above just left behind: the in-memory
      # test double claims to mirror the database's unique constraints and jsonb
      # columns, and until now nothing held it to that. #423 is what the gap
      # costs — an ON CONFLICT path that could only be tested after the same PR
      # taught the double what the constraint was.
      #
      # This runs here rather than in `npm test` on purpose. The brief's option C
      # proposed deriving the schema from the migration *files*, to keep the
      # suite database-free — but that means a second hand-written model of the
      # schema, checked against the first. With a real PostgreSQL already in this
      # job, asking the database is both cheaper and the only answer that cannot
      # itself be wrong.
      - name: Check the test double against the schema the migrations produce
        run: node scripts/check-test-double-schema.js
        # Repeated rather than shared: GitHub Actions does not resolve YAML
        # anchors in workflow files.
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: deckyard_migration_smoke
          DATABASE_USER: deckyard
          DATABASE_PASSWORD: deckyard
          DATABASE_SSL: 'false'

  # The storage layer's queries, against a real PostgreSQL. The `migrations` job
  # above proves the schema builds and rolls back; this one runs the actual
  # storage modules against the schema those migrations produce. Every other
  # test in the repo runs against tests/helpers/fake-db.js, an in-memory double
  # that models only the query shapes the storage layer uses and diverges from
  # PostgreSQL exactly where it hurts: a `DO UPDATE ... WHERE` that returns no
  # row (#423), a conflict target with the wrong columns, a `COALESCE(...) + n`
  # upsert the double approximates. This suite installs a live Kysely handle
  # through the same __setTestDb seam the double uses and exercises those paths
  # on the database itself. That is option A in
  # docs/plans/briefs/postgres-test-infra.md, the follow-up to D/C (#548/#551),
  # unblocked once runUp became importable from server/db/migrate.js.
  #
  # A separate job, like `migrations` and `test-fork`, so it costs ~0 wall-clock
  # on the critical path — GitHub runs it beside `test` — and a red mark reads
  # as "a real-DB query broke" without opening the run. The suite is kept out of
  # `npm test` by its `*.pgtest.js` naming (the default glob matches `*.test.js`
  # only), so a local `npm test` with no database still runs the pure suite.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deckyard
          POSTGRES_PASSWORD: deckyard
          POSTGRES_DB: deckyard_pg_tests
        ports:
          - 5432:5432
        # See the note in `migrations`: without the healthcheck the migrate step
        # races the container's boot and loses.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Read by server/config/database.js for every connection this job opens
      # (the migrate step and the suite alike). Shared at job level here because
      # both steps need the identical set; the `migrations` job repeats them
      # per-step only because its two steps predate this block.
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: deckyard_pg_tests
      DATABASE_USER: deckyard
      DATABASE_PASSWORD: deckyard
      DATABASE_SSL: 'false'
      STORAGE_MODE: postgres
      # The suite itself gates on DATABASE_URL: it TRUNCATEs, so it runs only
      # against a database explicitly named as throwaway — a signal a normal dev
      # `.env` (which uses DATABASE_HOST/NAME) never carries, so a local
      # `npm run test:pg` is inert unless deliberately pointed at a scratch DB.
      # Here it names the same throwaway database the migrate step builds.
      DATABASE_URL: postgres://deckyard:deckyard@localhost:5432/deckyard_pg_tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the schema the suite runs against
        run: npm run db:migrate
      - name: Run the storage-layer suite against PostgreSQL
        run: npm run test:pg
