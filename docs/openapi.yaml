openapi: 3.0.3
info:
  title: Deckyard Public API
  description: |
    The Deckyard Public API allows you to programmatically create, manage, and export presentations.

    ## Authentication

    All API requests require authentication using an API key. Include your API key in the `Authorization` header:

    ```
    Authorization: Bearer dk_live_your_api_key_here
    ```

    You can create and manage API keys in your Deckyard settings.

    ## Permissions

    Each API key carries a set of permissions that gate what it may do:

    | Permission | Grants |
    |-------|--------|
    | `read` | Read presentations, themes, slide types |
    | `write` | Create, update, delete presentations |
    | `export` | Export presentations |
    | `ai` | AI generation features |
    | `comments:read` | Read comments on accessible presentations |
    | `comments:write` | Create comments/replies and change comment status |

    ## Rate Limits

    API requests are subject to rate limits based on your account tier:

    | Tier | Requests/min | AI calls/day | Exports/day |
    |------|-------------|--------------|-------------|
    | Free | 60 | 10 | 50 |
    | Pro | 300 | 100 | 500 |
    | Enterprise | 1000 | Unlimited | Unlimited |

    Rate limit information is included in response headers:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Requests remaining
    - `X-RateLimit-Reset`: Unix timestamp when the limit resets

    ## Errors

    The API uses standard HTTP status codes:
    - `200` - Success
    - `201` - Created
    - `400` - Bad Request
    - `401` - Unauthorized
    - `403` - Forbidden
    - `404` - Not Found
    - `405` - Method Not Allowed (the `Allow` header lists the accepted methods)
    - `413` - Payload Too Large (request body over the configured size cap)
    - `423` - Locked (a changed slide is locked by the author or being edited by another user)
    - `429` - Rate Limited
    - `500` - Server Error
    - `502` - Bad Gateway (the upstream LLM vendor failed or returned unusable output)
    - `503` - Service Unavailable (database or AI backend not available)

    Every error response — from a validation 400 to an unexpected 500 — carries
    the same JSON envelope, and only this envelope:

    ```
    { "error": "<machine_code>", "message": "<human-readable detail>", "details": { } }
    ```

    - **`error`** is a stable, lowercase `snake_case` **machine code**. Branch on
      this, never on the prose. It is the field that stays put across releases;
      the codes are the same vocabulary the internal surface uses, e.g.
      `bad_request`, `unauthorized`, `forbidden`, `not_found`,
      `method_not_allowed`, `rate_limited`, `payload_too_large`, `bad_gateway`,
      `service_unavailable`, `internal_error` (plus domain codes such as
      `locked` for a 423). By default one code answers per HTTP status.
    - **`message`** is human-readable text, safe to show a user. Never a stack
      trace or internal detail — 5xx responses stay generic.
    - **`details`** is optional structured extra, omitted when absent. The daily
      AI/export limiters, for example, put `limit`, `used` and `resetAt` here.

    The public surface deliberately omits the internal envelope's `ok:false`
    discriminator — the HTTP status is the discriminator here. There is no second
    error shape: cross-cutting rejections (unknown route, wrong method, missing
    permission, rate limit) and endpoint-specific errors all answer this one
    envelope.

  version: '1.0.0'
  contact:
    name: Deckyard Support
    url: https://deckyard.com/support

servers:
  - url: /api/v1
    description: API v1

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: API info, documentation and format schemas (no authentication required)
  - name: Presentations
    description: Create, read, update, and delete presentations
  - name: Slides
    description: Slide-level operations within presentations
  - name: Comments
    description: Read and respond to reviewer comments (permissions comments:read / comments:write)
  - name: Publishing
    description: Publish and unpublish presentations
  - name: Translation
    description: AI-powered translation
  - name: Slide Library
    description: Access team slide library
  - name: Exports
    description: Export presentations in various formats
  - name: AI
    description: AI-powered content generation
  - name: Resources
    description: Themes, slide types, and other resources

paths:
  /:
    get:
      tags:
        - Meta
      summary: API info
      description: Returns API name, version and the main endpoint groups. Health-check friendly.
      security: []
      responses:
        '200':
          description: API info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Deckyard Public API
                  version:
                    type: string
                    example: v1
                  documentation:
                    type: string
                    example: /api/v1/docs
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string

  /docs:
    get:
      tags:
        - Meta
      summary: API documentation (Swagger UI)
      description: Serves an interactive Swagger UI for this specification.
      security: []
      responses:
        '200':
          description: Documentation page
          content:
            text/html:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags:
        - Meta
      summary: OpenAPI specification
      description: Serves this specification as YAML.
      security: []
      responses:
        '200':
          description: The OpenAPI specification
          content:
            text/yaml:
              schema:
                type: string

  /schema/deck.json:
    get:
      tags:
        - Meta
      summary: Deck format JSON Schema
      description: |
        The generated JSON Schema for the portable deck format. Generated live
        from the slide-type registry, so it always matches this install's
        actual types (including custom ones). Its `$defs` hold one content
        schema per slide type, selected by a `type` discriminator.
      security: []
      responses:
        '200':
          description: JSON Schema for the deck format
          content:
            application/json:
              schema:
                type: object

  /schema/slide-types/{type}.json:
    get:
      tags:
        - Meta
      summary: Slide-type content JSON Schema
      description: The generated JSON Schema for one slide type's content shape.
      security: []
      parameters:
        - name: type
          in: path
          required: true
          description: Slide type name (registry key, e.g. content-slide)
          schema:
            type: string
      responses:
        '200':
          description: JSON Schema for the slide type's content
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'

  /presentations:
    get:
      tags:
        - Presentations
      summary: List presentations
      description: Returns a paginated list of presentations accessible to the API key owner.
      parameters:
        - name: limit
          in: query
          description: Maximum number of presentations to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of presentations to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: viewOnly
          in: query
          description: Filter to view-only presentations only
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: List of presentations
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentations:
                    type: array
                    items:
                      $ref: '#/components/schemas/PresentationSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

    post:
      tags:
        - Presentations
      summary: Create a presentation
      description: Creates a new presentation with the specified properties.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Presentation title
                  example: "Q1 Business Review"
                description:
                  type: string
                  description: Presentation description
                themeId:
                  type: string
                  description: Theme ID to use
                  example: "default"
                language:
                  type: string
                  enum: [en-GB, nl]
                  description: Primary language
                  default: en-GB
                slides:
                  type: array
                  items:
                    $ref: '#/components/schemas/Slide'
                  description: Initial slides
      responses:
        '201':
          description: Presentation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentation:
                    $ref: '#/components/schemas/Presentation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}:
    get:
      tags:
        - Presentations
      summary: Get a presentation
      description: Returns a single presentation by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presentation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentation:
                    $ref: '#/components/schemas/Presentation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    put:
      tags:
        - Presentations
      summary: Update a presentation
      description: Updates an existing presentation.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                themeId:
                  type: string
                slides:
                  type: array
                  items:
                    $ref: '#/components/schemas/Slide'
      responses:
        '200':
          description: Presentation updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentation:
                    $ref: '#/components/schemas/Presentation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/SlideLocked'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      tags:
        - Presentations
      summary: Delete a presentation
      description: Moves a presentation to trash. Only the owner can delete.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presentation deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/duplicate:
    post:
      tags:
        - Presentations
      summary: Duplicate a presentation
      description: Creates a copy of an existing presentation.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID to duplicate
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Presentation duplicated
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentation:
                    $ref: '#/components/schemas/Presentation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/slides:
    post:
      tags:
        - Slides
      summary: Create a slide
      description: Creates a new slide in the presentation at the specified position.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  description: >-
                    Slide type as its canonical reverse-DNS id (e.g.
                    `eu.deckyard.slide.content`). The bare registry key
                    (`content-slide`) is also accepted and normalized on write
                    during the beta convergence.
                content:
                  type: object
                  description: Slide content
                notes:
                  type: string
                  description: Speaker notes
                visibility:
                  type: object
                  description: Per-context visibility flags
                atIndex:
                  type: integer
                  description: Insert at this index (0-based)
                afterSlideId:
                  type: string
                  description: Insert after this slide ID
      responses:
        '201':
          description: Slide created
          content:
            application/json:
              schema:
                type: object
                properties:
                  slide:
                    $ref: '#/components/schemas/Slide'
                  index:
                    type: integer
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      slideCount:
                        type: integer
                      revision:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/slides/{slideId}:
    get:
      tags:
        - Slides
      summary: Get a slide
      description: Returns a single slide from a presentation.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
        - name: slideId
          in: path
          required: true
          description: Slide ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Slide details
          content:
            application/json:
              schema:
                type: object
                properties:
                  slide:
                    $ref: '#/components/schemas/Slide'
                  index:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    put:
      tags:
        - Slides
      summary: Update a slide
      description: Replaces slide content with the provided data.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
        - name: slideId
          in: path
          required: true
          description: Slide ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: >-
                    Slide type as its canonical reverse-DNS id (e.g.
                    `eu.deckyard.slide.title`); the bare registry key is also
                    accepted and normalized on write during the beta convergence.
                content:
                  type: object
                  description: New slide content
                notes:
                  type: string
                  description: Speaker notes
                visibility:
                  type: object
                  description: Per-context visibility flags
      responses:
        '200':
          description: Slide updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  slide:
                    $ref: '#/components/schemas/Slide'
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      revision:
                        type: integer
                      updatedAt:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/SlideLocked'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      tags:
        - Slides
      summary: Delete a slide
      description: Removes a slide from the presentation. Cannot delete the last slide.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
        - name: slideId
          in: path
          required: true
          description: Slide ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Slide deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      slideCount:
                        type: integer
                      revision:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/SlideLocked'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/slides/reorder:
    post:
      tags:
        - Slides
      summary: Reorder slides
      description: Reorders slides in the presentation according to the provided ID array.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - slideIds
              properties:
                slideIds:
                  type: array
                  items:
                    type: string
                  description: Ordered array of slide IDs
      responses:
        '200':
          description: Slides reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  slides:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        index:
                          type: integer
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      revision:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/slides/from-library:
    post:
      tags:
        - Slides
      summary: Add slide from library
      description: Copies a slide from the team library into the presentation.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - libraryItemId
              properties:
                libraryItemId:
                  type: string
                  description: ID of the library item to copy
                atIndex:
                  type: integer
                  description: Insert at this index
                afterSlideId:
                  type: string
                  description: Insert after this slide ID
      responses:
        '201':
          description: Slide added from library
          content:
            application/json:
              schema:
                type: object
                properties:
                  slide:
                    $ref: '#/components/schemas/Slide'
                  index:
                    type: integer
                  copiedFrom:
                    type: object
                    properties:
                      libraryItemId:
                        type: string
                      libraryItemName:
                        type: string
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      slideCount:
                        type: integer
                      revision:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/publish:
    get:
      tags:
        - Publishing
      summary: Get publish status
      description: Returns the publication status of a presentation.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Publish status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isPublished:
                    type: boolean
                  publishId:
                    type: string
                  slug:
                    type: string
                  path:
                    type: string
                  ogImageUrl:
                    type: string
                  publishedAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    post:
      tags:
        - Publishing
      summary: Publish presentation
      description: Makes the presentation publicly accessible via a share link.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishId:
                    type: string
                  slug:
                    type: string
                  path:
                    type: string
                  ogImageUrl:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      tags:
        - Publishing
      summary: Unpublish presentation
      description: Removes public access to the presentation.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unpublished successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  unpublished:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/translate:
    post:
      tags:
        - Translation
      summary: Translate presentation
      description: |
        Uses AI to translate the presentation to a target language.
        Requires the 'ai' permission on your API key.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetLang
              properties:
                targetLang:
                  type: string
                  description: Target language code
                  enum: [nl, en-GB, de, fr, es, pt, it, pl, fi, da, sv, 'no']
                sourceLang:
                  type: string
                  description: Source language code (defaults to active language)
                vendor:
                  type: string
                  description: AI vendor to use
                overwrite:
                  type: boolean
                  description: Overwrite existing translation
                  default: false
                fillMissing:
                  type: boolean
                  description: Only fill missing translations
                  default: true
      responses:
        '200':
          description: Translation complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  translated:
                    type: boolean
                  from:
                    type: string
                  to:
                    type: string
                  presentation:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /translate/languages:
    get:
      tags:
        - Translation
      summary: List supported languages
      description: Returns all supported translation languages.
