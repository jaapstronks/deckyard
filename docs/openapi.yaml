                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/comments:
    get:
      operationId: listComments
      tags:
        - Comments
      summary: List comments
      description: |
        Returns the comments on a presentation (newest first) with nested
        replies. Each comment carries current slide context (`slide`), the
        slide snapshot captured when the comment was created
        (`slideSnapshot`, `null` for comments that predate snapshots) and an
        `editUrl` deep link anchored to the commented slide.
        Requires the `comments:read` permission and the database storage backend.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by status (default all)
          schema:
            type: string
            enum: [open, resolved, dismissed, all]
        - name: slideId
          in: query
          description: Only comments anchored to this slide id
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          description: Only comments created at/after this ISO 8601 date/datetime
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Comments on the presentation
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentationId:
                    type: string
                    format: uuid
                  presentationTitle:
                    type: string
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  total:
                    type: integer
                  since:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          description: |
            A `status` outside its values or a `since` that is not a date is
            refused with 400 `invalid`, `details.field` naming the parameter
            (the same refusal the app and MCP give).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    post:
      operationId: createComment
      tags:
        - Comments
      summary: Create a comment or reply
      description: |
        Creates a comment (or a reply when `parentId` is given) authored by
        the API key owner. When `slideId` is given, a snapshot of that slide
        is stored with the comment. A `slideId` that names no slide of the
        deck, or a `parentId` that names no comment on it, answers 404
        (`slide_not_found` / `parent_not_found`); a reply to a reply joins
        the top of its thread. Requires the `comments:write` permission and
        comment permission on the presentation (owner/creator, organization
        member, or collaborator with comment rights).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  description: Comment text (max 5000 characters)
                slideId:
                  type: string
                  format: uuid
                  description: Anchor the comment to this slide
                parentId:
                  type: string
                  format: uuid
                  description: Reply to this top-level comment
      responses:
        '201':
          description: Created comment
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  comment:
                    $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /comments/{commentId}/status:
    post:
      operationId: setCommentStatus
      tags:
        - Comments
      summary: Change comment status
      description: |
        Resolve, reopen or dismiss a comment. Allowed transitions follow the
        app: open→resolved, open→dismissed, resolved→open; any other answers
        400 with the transition's reason code.
        Requires the `comments:write` permission; only the presentation
        owner/creator may change status.
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [resolved, open, dismissed]
      responses:
        '200':
          description: Updated comment
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  comment:
                    $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key authentication

  schemas:
    Tag:
      type: object
      description: >-
        A tag of this organization. One shape wherever a tag is returned; a
        write takes tag names (`{ tags: ["name", ...] }`) and answers with
        these objects.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PresentationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The deck owner's stable user id — the canonical identity of an
            owner, and the only field to compare when asking "is this mine?".
            Null for a deck whose owner has no user record on this instance
            (an external or legacy owner); that is a defined absence, not an
            error.
        createdById:
          type: string
          format: uuid
          nullable: true
          description: The stable user id of whoever created the deck. Null as for `ownerId`.
        updatedById:
          type: string
          format: uuid
          nullable: true
          description: The stable user id of the last writer. Null as for `ownerId`.
        ownerEmail:
          type: string
          nullable: true
          description: >-
            **Display and contact only — never an identity.** The deck owner's
            email, returned only when the requesting API key belongs to the
            owner; for decks reached via organization or collaborator access it is
            null, so one user's address is never disclosed to another. Do not
            compare it to decide ownership: an address can be reassigned and a
            person can hold several, which is why `ownerId` exists. No request
            body identifies an owner by email — email remains the mechanism for
            *inviting collaborators*, and nothing else.
        visibility:
          type: string
          enum: [private, organization]
          description: >-
            Who can see the deck besides its owner, creator, and collaborators:
            'private' (default) or 'organization' (every member of the deck's
            organization).
        isViewOnly:
          type: boolean
          description: >-
            Whether an organization-visible deck is view-only: readable and
            commentable by other members, but not editable. Always false for
            private decks. This is the property the `?viewOnly=true` list filter
            matches on.
        theme:
          type: string
          nullable: true
          description: >-
            The deck's theme id, or `default` for a deck that follows this
            installation's default theme.
        lang:
          type: string
          nullable: true
          description: The deck language (BCP 47 tag).
        slideCount:
          type: integer
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Presentation:
      allOf:
        - $ref: '#/components/schemas/PresentationSummary'
        - type: object
          properties:
            slides:
              type: array
              items:
                $ref: '#/components/schemas/Slide'
            i18n:
              type: object
              description: >-
                Internationalization data. `versions` holds one language
                version per key, and each key is a canonical deck language
                (`nl`, `en-GB`, `de`, …). A write with any other key — the
                alias `en` included — is refused with 400 `invalid` and
                `details.field` = `i18n.versions`.
            revision:
              type: integer

    Slide:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: >-
            Slide type as its canonical reverse-DNS id (e.g.
            `eu.deckyard.slide.title`) — the one spelling reads and exports emit.
        content:
          type: object
          description: >-
            Per-type structured slide content. The concrete shape depends on
            `type` and is described by a generated, versioned JSON Schema:
            fetch the full deck schema at `/api/v1/schema/deck.json` (its
            `$defs` hold one content schema per slide type, selected by a
            `type` discriminator), or a single type's content schema at
            `/api/v1/schema/slide-types/{type}.json`. Both are generated from
            the slide-type field registry, so they always match the running
            build.
          properties:
            textStyles:
              type: object
              description: >-
                Alignment and size for the text a slide type offers styling
                on, one key per offer: a field (`body`), every item of a list
                at once (`quotes.*.quote`) or a declared set of fields styled
                as one (`@<id>`). Most text offers nothing. Which keys a type
                offers, and which `align` and `size` values each takes, is in
                that type's content schema under `textStyles` (absent when the
                type offers nothing). A write that asks for anything else is
                refused, not pruned: 400 `invalid` with `details` shaped as
                `TextStyleRefusal`, the message naming the key and why.
              additionalProperties:
                type: object
                properties:
                  align:
                    type: string
                    enum: [left, center, right]
                  size:
                    type: string
                    enum: [sm, md, lg]
                additionalProperties: false
          additionalProperties: true
        notes:
          type: string
          description: Speaker notes
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Parent slide id for nested (vertical) slides; null for top-level slides.
        visibility:
          type: object
          description: Per-context visibility flags for the slide (empty object = visible everywhere).
          additionalProperties: true

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        presentationId:
          type: string
          format: uuid
        slideId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        authorId:
          type: string
          format: uuid
          nullable: true
          description: |
            The comment author's stable user id. This used to be
            `authorEmail`/`authorName`, the commenter's address and name, handed
            to any key with `comments:read` — a contact detail the caller has no
            claim on (D22). Null for a share-link guest, who has no user record;
            `authorGuestId` names them instead.
        authorGuestId:
          type: string
          format: uuid
          nullable: true
          description: The share-link guest who wrote it, when the author is one.
        isAi:
          type: boolean
          description: Whether this instance's AI assistant wrote the comment.
        body:
          type: string
        status:
          type: string
          enum: [open, resolved, dismissed]
        resolvedById:
          type: string
          format: uuid
          nullable: true
          description: |
            Who resolved it, by stable user id. Was `resolvedBy`, their address,
            until D22.
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        slide:
          type: object
          nullable: true
          description: |
            Current context of the commented slide: null when the comment has
            no slide anchor; `{ "deleted": true }` when the slide no longer
            exists; otherwise index/number/type/title as the deck is now.
          properties:
            deleted:
              type: boolean
            index:
              type: integer
              description: 0-based slide index
            number:
              type: integer
              description: 1-based slide number
            type:
              type: string
            title:
              type: string
        slideSnapshot:
          type: object
          nullable: true
          description: |
            The commented slide ({ id, type, content }) as it was when the
            comment was created. Null for comments without a slide anchor and
            for comments created before snapshots existed.
        editUrl:
          type: string
          nullable: true
          description: Editor deep link, anchored to the commented slide via ?slideId=
        mentions:
          type: array
          description: |
            Parsed @-mentions of this comment, filled server-side from the
            body markup `@[Display Name](user:email@example.com)`. Mentioned
            users receive a `comment_mention` notification. Empty when the
            comment has no mentions.
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
        replies:
          type: array
          items:
            type: object
          description: Nested replies (same shape as Comment, without further nesting)

    Theme:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [system, custom]
        logoUrl:
          type: string
        colors:
          type: object
        fonts:
          type: object
        isDefault:
          type: boolean
          description: Whether this theme is the API key organization's current default.

    SlideType:
      type: object
      description: |
        Resolved metadata for one slide type, keyed in the response by its
        registry key (`title-slide`). Every optional key below is omitted rather
        than nulled when it does not apply — a consumer must treat "absent" and
        "empty" as different answers, because several facets (`inspectorKeeps`
        in particular) use that distinction deliberately.

        The response is the wire half of the aggregator-seam rule: the editor
        holds this payload, not the registry, so companions are resolved here.
        A fork type that declares its own facets is only heard because the
        resolved values travel.
      properties:
        label:
          type: string
        fields:
          type: object
        defaults:
          type: object
        tier:
          type: integer
          enum: [1, 2, 3]
          description: >-
            Spec ladder: 1 = the normative core profile, 2 = the rest of what
            Deckyard ships, 3 = fork/org extension. Derived from the name, so a
            fork type under a new name reads as 3 without declaring anything.
        fallback:
          type: string
          description: >-
            The tier-1 type a core-profile-only reader should render this as.
            Absent on tier-1 types, which are their own contract.
        structure:
          type: string
          description: >-
            Content shape (singleton / collection / tabular / …). Normative
            since the schema opened; see deck-conformance.md.
        runtime:
          type: string
          description: >-
            What the presenting session must do beyond serving the slide
            (static / timed / live).
        interaction:
          type: string
          description: >-
            The sub-contract `runtime: live` implies — which kind of answer the
            audience sends. Absent on everything else.
        deprecated:
          type: boolean
          description: >-
            Still rendered for existing decks, but hidden from the picker and
            withheld from agents. Absent when false.
        themeId:
          type: string
          description: Restricts the type to a single theme.
        defaultsByLang:
          type: object
          description: Per-language overrides of `defaults`.
        inline:
          type: object
          description: >-
            Inline (WYSIWYG) edit descriptor declared on the definition. Read
            *before* the client's core map, so an override of a core name
            supplies its own. JSON-only — function-valued options are
            core-map-only.
        inspectorKeeps:
          type: array
          items:
            type: string
          description: >-
            Fields the settings inspector keeps rendering once the canvas covers
            the rest. Absent (not `[]`) when nobody narrows the type — the
            inspector's conservative fallback depends on that difference.
        layoutVariants:
          type: array
          items:
            type: object
          description: Layout catalogue for the editor's layout switcher. Absent = no switcher.
        layoutMirror:
          type: object
          description: Which enum field mirrors the layout (image left/right).
        layoutTextColumns:
          type: object
          description: Which enum field sets the text-column count, and for which layout values.
        group:
          type: string
          description: Curated picker/settings group (resolved authoring companion).
        schematic:
          type: object
          description: Picker glyph (resolved authoring companion).
        sampleContent:
          type: object
          description: Sample content used by the picker preview (resolved authoring companion).
        description:
          type: string
          description: Picker tile tooltip.
        aliases:
          type: array
          items:
            type: string
          description: Extra search terms for the picker's haystack.

    SlideLibraryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slideType:
          type: string
        theme:
          type: string
          nullable: true
          description: >-
            The theme the item was saved against, or null for an item that
            fits any theme.
        content:
          type: object
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        createdAt:
          type: string
          format: date-time
        createdById:
          type: string
          format: uuid
          nullable: true
          description: >-
            The stable user id of whoever added the item to the library. This
            was `createdBy`, their e-mail address, until D22: an id names the
            same person and discloses nothing about them, exactly as `ownerId`
            does on a deck. Null for an item whose creator has no user record
            on this instance — a defined absence, not an error.

    DeckExport:
      type: object
      properties:
        format:
          type: string
          description: >-
            Format sentinel. Always `deckyard.deck`; an import carrying the
            historical `slidecreator.deck` is folded to it on read.
          example: 'deckyard.deck'
        version:
          type: integer
        title:
          type: string
        lang:
          type: string
          description: BCP 47 tag of the language `content`, `title` and `notes` are in.
        translations:
          type: object
          description: The deck title per other language, keyed by BCP 47 tag.
          additionalProperties:
            type: object
            properties:
              title:
                type: string
        theme:
          type: string
        slides:
          type: array
          description: >-
            Each slide is `{ type, content }` plus the optional `translations`,
            `notes`, `duration` and `visibility`; `/api/v1/schema/deck.json`
            describes them per slide type.
          items:
            type: object

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    TextStyleRefusal:
      type: object
      description: >-
        The `details` of a 400 `invalid` that refuses a slide's
        `content.textStyles`, on every write that stores slides. `reason`
        says why: `text_style_per_instance` (one item of a list, or one member
        of a set, where the type offers the shared key; the message names it),
        `text_style_not_offered` (a key the type offers nothing for),
        `text_style_property_not_offered` (a property outside the offer,
        `color` always), `text_style_value_not_offered` (a value outside the
        vocabulary, or an alignment the field's role rules out),
        `text_style_malformed` (`textStyles` or one of its entries is not an
        object). Only the first refusal is reported.
      required: [field, index, reason]
      properties:
        field:
          type: string
          enum: [slides]
        index:
          type: integer
          description: Position of the refused slide in the written list.
        reason:
          type: string
          enum:
            - text_style_per_instance
            - text_style_not_offered
            - text_style_property_not_offered
            - text_style_value_not_offered
            - text_style_malformed

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: >-
            Stable lowercase snake_case machine code. Branch on this, not on
            `message`. One code answers per HTTP status by default (e.g.
            `not_found`, `forbidden`, `rate_limited`), plus domain codes such
            as `locked` for a 423 or `maintenance` for a 503.
          example: not_found
        message:
          type: string
          description: Human-readable detail, safe to display. Never leaks internals.
        details:
          type: object
          description: Optional structured extra, omitted when absent.

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: >-
        Unauthorized - no valid credential. The API key is missing, malformed
        or revoked. Authenticating with a valid key is what changes the answer;
        a valid key that simply lacks the permission gets 403, never 401.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: >-
        Forbidden - the credential is valid but not allowed: the key lacks the
        required permission, or the caller has no (write) access to this
        presentation. Retrying with the same key will not help.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    SlideLocked:
      description: >-
        Locked - a changed slide is locked. Author-locked slides
        (lockedByAuthor) reject content edits from non-authors; slides being
        edited by another user (concurrent slide lock) reject edits from
        everyone but the lock holder. Details include slideId and lockKind
        (author or concurrent).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RateLimited:
      description: >-
        Rate limit exceeded (`error: rate_limited`). Two limiters answer with
        this status: the per-minute request limiter (sets `Retry-After` only)
        and the daily AI/export limiters (set the `X-RateLimit-*` headers and
        carry `limit`, `used` and `resetAt` inside `details`). All headers are
        therefore optional.
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  details:
                    type: object
                    description: Present for the daily limiters.
                    properties:
                      limit:
                        type: integer
                        description: Daily limit
                      used:
                        type: integer
                        description: Requests used today
                      resetAt:
                        type: integer
                        description: Unix timestamp when the limit resets

    BadGateway:
      description: >-
        Bad gateway — the upstream LLM vendor failed or returned output the
        server could not use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: >-
        Service unavailable — the database backend is down or a required
        backend (AI, comment store) is not configured on this install
        (`error: service_unavailable`), or a maintenance window is briefly
        refusing writes (`error: maintenance`, with a `Retry-After` header
        naming when to come back).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: >-
        Internal error — the request was well-formed and authorized, but the
        server could not complete it (`error: internal_error`). Retrying an
        identical request is unlikely to help.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
