  /presentations/{id}/export/pptx-editable:
    get:
      operationId: exportPresentationPptxEditable
      tags:
        - Exports
      summary: Export as PowerPoint (editable)
      description: >-
        Exports the presentation as a PPTX file on the theme's layouts, with
        text and pictures that PowerPoint can edit, as far as each slide type
        allows. A slide whose type cannot be written as editable objects
        travels as an image; the `X-Image-Slides` response header names those
        slides.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          schema:
            type: string
            enum: [nl, en-GB, de, fr, es, pt, it, pl, fi, da, sv, 'no']
        - name: scale
          in: query
          description: Image scale factor (1-3) for the slides that travel as an image
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 2
      responses:
        '200':
          description: Editable PowerPoint export
          headers:
            X-Image-Slides:
              description: >-
                The 1-based numbers of the slides written as an image,
                separated by commas (for example `3,7`). Absent when every
                slide is editable.
              schema:
                type: string
                pattern: '^[0-9]+(,[0-9]+)*$'
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
