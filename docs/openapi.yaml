openapi: 3.0.3
info:
  title: Deckyard Public API
  description: |
    The Deckyard Public API allows you to programmatically create, manage, and export presentations.

    ## Authentication

    All API requests require authentication using an API key. Include your API key in the `Authorization` header:

    ```
    Authorization: Bearer dk_live_your_api_key_here
    ```

    You can create and manage API keys in your Deckyard settings.

    ## Permissions

    Each API key carries a set of permissions that gate what it may do:

    | Permission | Grants |
    |-------|--------|
    | `read` | Read presentations, themes, slide types |
    | `write` | Create, update, delete presentations |
    | `export` | Export presentations |
    | `ai` | AI generation features |
    | `comments:read` | Read comments on accessible presentations |
    | `comments:write` | Create comments/replies and change comment status |

    ## Rate Limits

    API requests are subject to rate limits based on your account tier:

    | Tier | Requests/min | AI calls/day | Exports/day |
    |------|-------------|--------------|-------------|
    | Free | 60 | 10 | 50 |
    | Pro | 300 | 100 | 500 |
    | Enterprise | 1000 | Unlimited | Unlimited |

    Rate limit information is included in response headers:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Requests remaining
    - `X-RateLimit-Reset`: Unix timestamp when the limit resets

    ## Errors

    The API uses standard HTTP status codes:
    - `200` - Success
    - `201` - Created
    - `400` - Bad Request
    - `401` - Unauthorized (no valid API key: missing, malformed or revoked)
    - `403` - Forbidden (the key is valid but lacks the permission, or has no
      access to this presentation)
    - `404` - Not Found (also every AI endpoint on an instance with AI switched
      off: `AI_ENABLED=false`, demo or sandbox — it is not mounted there, and
      the spec this instance serves leaves those paths out)
    - `405` - Method Not Allowed (the `Allow` header lists the accepted methods)
    - `413` - Payload Too Large (request body over the configured size cap)
    - `423` - Locked (a changed slide is locked by the author or being edited by another user)
    - `429` - Rate Limited
    - `500` - Server Error
    - `502` - Bad Gateway (the upstream LLM vendor failed or returned unusable output)
    - `503` - Service Unavailable (database or AI backend not available)

    Every error response — from a validation 400 to an unexpected 500 — carries
    the same JSON envelope, and only this envelope:

    ```
    { "error": "<machine_code>", "message": "<human-readable detail>", "details": { } }
    ```

    - **`error`** is a stable, lowercase `snake_case` **machine code**. Branch on
      this, never on the prose. It is the field that stays put across releases;
      the codes are the same vocabulary the internal surface uses, e.g.
      `bad_request`, `unauthorized`, `forbidden`, `not_found`,
      `method_not_allowed`, `rate_limited`, `payload_too_large`, `bad_gateway`,
      `service_unavailable`, `internal_error` (plus domain codes such as
      `locked` for a 423, or `maintenance` for a 503 during a deploy window).
      By default one code answers per HTTP status.
    - **`message`** is human-readable text, safe to show a user. Never a stack
      trace or internal detail — 5xx responses stay generic.
    - **`details`** is optional structured extra, omitted when absent. The daily
      AI/export limiters, for example, put `limit`, `used` and `resetAt` here.

    The public surface deliberately omits the internal envelope's `ok:false`
    discriminator — the HTTP status is the discriminator here. There is no second
    error shape: cross-cutting rejections (unknown route, wrong method, missing
    permission, rate limit) and endpoint-specific errors all answer this one
    envelope.

    ## Optional clusters

    A path that belongs to an installation cluster carries `x-feature: <key>`
    (today only `ai`). The spec served at `/api/v1/openapi.yaml` leaves out
    every path whose cluster is off on that instance, so it describes what the
    instance answers. The whole v1 surface is itself a cluster: with
    `PUBLIC_API_ENABLED=false` nothing under `/api/v1` exists, this spec
    included.

  version: '1.0.0'
  contact:
    name: Deckyard Support
    url: https://deckyard.com/support

servers:
  - url: /api/v1
    description: API v1

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: API info, documentation and format schemas (no authentication required)
  - name: Presentations
    description: Create, read, update, and delete presentations
  - name: Slides
    description: Slide-level operations within presentations
  - name: Comments
    description: Read and respond to reviewer comments (permissions comments:read / comments:write)
  - name: Publishing
    description: Publish and unpublish presentations
  - name: Translation
    description: AI-powered translation
  - name: Slide Library
    description: Access team slide library
  - name: Exports
    description: Export presentations in various formats
  - name: AI
    description: AI-powered content generation
  - name: Resources
    description: Themes, slide types, and other resources

paths:
  /:
    get:
      operationId: getApiInfo
      tags:
        - Meta
      summary: API info
      description: Returns API name, version and the main endpoint groups. Health-check friendly.
      security: []
      responses:
        '200':
          description: API info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Deckyard Public API
                  version:
                    type: string
                    example: v1
                  documentation:
                    type: string
                    example: /api/v1/docs
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string

  /docs:
    get:
      operationId: getApiDocs
      tags:
        - Meta
      summary: API documentation (Swagger UI)
      description: Serves an interactive Swagger UI for this specification.
      security: []
      responses:
        '200':
          description: Documentation page
          content:
            text/html:
              schema:
                type: string

  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags:
        - Meta
      summary: OpenAPI specification
      description: Serves this specification as YAML.
      security: []
      responses:
        '200':
          description: The OpenAPI specification
          content:
            text/yaml:
              schema:
                type: string

  /schema/deck.json:
    get:
      operationId: getDeckSchema
      tags:
        - Meta
      summary: Deck format JSON Schema
      description: |
        The generated JSON Schema for the portable deck format. Generated live
        from the process-wide slide-type registry, so it includes core and
        file-based types. Its `$defs` hold one content
        schema per slide type, selected by a `type` discriminator.
      security: []
      responses:
        '200':
          description: JSON Schema for the deck format
          content:
            application/json:
              schema:
                type: object

  /schema/slide-types/{type}.json:
    get:
      operationId: getSlideTypeSchema
      tags:
        - Meta
      summary: Slide-type content JSON Schema
      description: |
        The generated JSON Schema for one slide type's content shape. Core and
        file-based types are public. Send an API key with read permission to
        retrieve a published database-backed type from that key's organization.
        The type is named by its published id only, the spelling
        `slides[].type` carries in an export; a bare registry key
        (`content-slide`) or a qualified form answers 404.
      security: []
      parameters:
        - name: type
          in: path
          required: true
          description: Published slide type id (e.g. eu.deckyard.slide.content; a fork type without a dotted authority keeps the slash form, e.g. custom/hero, sent as two path segments; an organization type publishes as its key, e.g. custom-partner-wall)
          schema:
            type: string
      responses:
        '200':
          description: JSON Schema for the slide type's content
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /presentations:
    get:
      operationId: listPresentations
      tags:
        - Presentations
      summary: List presentations
      description: Returns a paginated list of presentations accessible to the API key owner.
      parameters:
        - name: limit
          in: query
          description: Maximum number of presentations to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of presentations to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: viewOnly
          in: query
          description: >-
            `true` lists only view-only presentations, `false` only the
            others. Any other value is refused with 400 `invalid` and
            `details.field: viewOnly`.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: List of presentations
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentations:
                    type: array
                    items:
                      $ref: '#/components/schemas/PresentationSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

    post:
      operationId: createPresentation
      tags:
        - Presentations
      summary: Create a presentation
      description: >-
        Creates a new presentation with the specified properties. A deck's
        theme and language are named `theme` and `lang` everywhere; the retired
        spellings `themeId` and `language` are refused with a 400 whose
        `details` name the field to use instead. The deck is owned by the
        key's owner; an `ownerEmail` in the body is refused with a 400, as
        is a `lang` outside the enum. A create is recorded in the deck's
        activity feed like one made in the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Presentation title
                  example: 'Q1 Business Review'
                description:
                  type: string
                  description: Presentation description
                theme:
                  type: string
                  description: >-
                    Theme id, exactly as `GET /themes` lists it: a built-in
                    theme or one of your organization's themes, by id or
                    (lower-case) UUID. `default` is a value of its own: the
                    deck follows this installation's default theme, resolved
                    at render time, so it moves along when the installation's
                    default changes. Omitted, the installation's default
                    applies. An unknown theme, or another spelling of a known
                    one, is refused with a 400.
                  example: 'default'
                lang:
                  type: string
                  enum: [nl, en-GB, de, fr, es, pt, it, pl, fi, da, sv, 'no']
                  description: >-
                    The deck language. Fixed at create: another language is a
                    version of the deck, added with
                    `POST /presentations/{id}/translate`. An unsupported value
                    is refused with a 400. Omitted, the instance default
                    applies.
                slides:
                  type: array
                  items:
                    $ref: '#/components/schemas/Slide'
                  description: >-
                    Initial slides. The deck mints its own `id` for each one, so
                    any `id` you send is only a handle for the same payload: a
                    `parentId` naming another slide in the array keeps that
                    slide nested under it, and a `parentId` naming anything else
                    is dropped to `null`. Content keys that identify a slide
                    instance rather than its text (a poll's `pollId`, a
                    follow-invite's `presentationId`) are re-derived against the
                    new deck, so a slide copied from elsewhere never shares its
                    live poll or its QR target with the deck it came from.
                    A slide may carry `contentByLang`, an object of content
                    per deck language: each key becomes a language version of
                    the deck, so each key must be a canonical deck language
                    (the `lang` values above) and each value a content object.
                    Leave the field out for a single-language slide. A
                    `contentByLang` that is not an object (`null` included), a
                    value that is not an object, or an `en` or unsupported key
                    is refused with a 400 `invalid`, `details.field` =
                    `slides`, the message naming `slides[i].contentByLang`,
                    and nothing is created.
      responses:
        '201':
          description: Presentation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentation:
                    $ref: '#/components/schemas/Presentation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}:
    get:
      operationId: getPresentation
      tags:
        - Presentations
      summary: Get a presentation
      description: Returns a single presentation by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presentation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentation:
                    $ref: '#/components/schemas/Presentation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    put:
      operationId: updatePresentation
      tags:
        - Presentations
      summary: Update a presentation
      description: >-
        Updates an existing presentation. A save never moves the owner or the
        creator and never changes the deck language: the values a GET handed
        out (`ownerEmail` as the owner's own address or `null`, the deck's
        `lang`) are accepted as a plain save, and a different value is refused
        with 400 `invalid` and `details.field` naming the field. As on create,
        `themeId` and `language` are refused with a 400 naming `theme` and
        `lang`. The same save backs the editor, so the same refusals hold
        there.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                theme:
                  type: string
                  description: >-
                    Switch the deck to this theme. Goes through the same theme
                    switch as the editor. The deck's current theme, echoed
                    back from a GET, is a plain save; an unknown theme, or
                    another spelling of a known one, is refused with a 400.
                    `default` makes the deck follow the installation's
                    default theme again (see create).
                lang:
                  type: string
                  description: >-
                    Read-only after create. The deck's current `lang`, echoed
                    back from a GET, is accepted; a different value is refused
                    with 400 `invalid`, `details.field` = `lang`. Add a language version with
                    `POST /presentations/{id}/translate`.
                slides:
                  type: array
                  items:
                    $ref: '#/components/schemas/Slide'
      responses:
        '200':
          description: Presentation updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentation:
                    $ref: '#/components/schemas/Presentation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The deck would exceed the size limits (`error: limit_exceeded`,
            the message names the limit). Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          $ref: '#/components/responses/SlideLocked'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      operationId: deletePresentation
      tags:
        - Presentations
      summary: Delete a presentation
      description: Moves a presentation to trash. Only the owner can delete.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presentation deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/duplicate:
    post:
      operationId: duplicatePresentation
      tags:
        - Presentations
      summary: Duplicate a presentation
      description: Creates a copy of an existing presentation.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID to duplicate
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Presentation duplicated
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentation:
                    $ref: '#/components/schemas/Presentation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/slides:
    post:
      operationId: createSlide
      tags:
        - Slides
      summary: Create a slide
      description: Creates a new slide in the presentation at the specified position.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  description: >-
                    Slide type as its canonical reverse-DNS id (e.g.
                    `eu.deckyard.slide.content`). The bare registry key
                    (`content-slide`) is also accepted and normalized on write
                    during the beta convergence.
                content:
                  type: object
                  description: Slide content
                notes:
                  type: string
                  description: Speaker notes
                visibility:
                  type: object
                  description: Per-context visibility flags
                atIndex:
                  type: integer
                  description: Insert at this index (0-based)
                afterSlideId:
                  type: string
                  description: Insert after this slide ID, in its group (after a child slide the new slide is a child of the same parent)
      responses:
        '201':
          description: Slide created
          content:
            application/json:
              schema:
                type: object
                properties:
                  slide:
                    $ref: '#/components/schemas/Slide'
                  index:
                    type: integer
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      slideCount:
                        type: integer
                      revision:
                        type: integer
        '400':
          description: >-
            Bad request. A slide that fails validation answers
            `error: bad_request`, `message: Invalid slide data` and
            `details: { errors: [...] }`: one human-readable sentence per
            problem. `details` is an object, like every v1 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/slides/{slideId}:
    get:
      operationId: getSlide
      tags:
        - Slides
      summary: Get a slide
      description: Returns a single slide from a presentation.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
        - name: slideId
          in: path
          required: true
          description: Slide ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Slide details
          content:
            application/json:
              schema:
                type: object
                properties:
                  slide:
                    $ref: '#/components/schemas/Slide'
                  index:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    put:
      operationId: updateSlide
      tags:
        - Slides
      summary: Update a slide
      description: >-
        Replaces the slide with the provided data. Changing `type` without
        sending `content` converts the slide: its content is re-seeded for the
        new type and the fields that map carry over, the same conversion the
        editor and the MCP `update_slide` tool run. A pair with no declared
        conversion is refused with 400 `unsupported_conversion`. Changing
        `type` together with `content` replaces the slide outright.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
        - name: slideId
          in: path
          required: true
          description: Slide ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: >-
                    Slide type as its canonical reverse-DNS id (e.g.
                    `eu.deckyard.slide.title`); the bare registry key is also
                    accepted and normalized on write during the beta convergence.
                content:
                  type: object
                  description: >-
                    New slide content. Omit it on a type change to convert the
                    existing content instead.
                notes:
                  type: string
                  description: Speaker notes
                visibility:
                  type: object
                  description: Per-context visibility flags
      responses:
        '200':
          description: Slide updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  slide:
                    $ref: '#/components/schemas/Slide'
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      revision:
                        type: integer
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: >-
            Bad request. An unknown type or invalid slide data answers
            `error: bad_request`; invalid slide data carries
            `details: { errors: [...] }`, one sentence per problem (an object,
            like every v1 error). A type change without `content` for a pair that has no
            declared conversion answers `error: unsupported_conversion` with
            `details: { from, to, convertible }`: the current type, the refused
            type and the types this slide does convert to, all as canonical
            ids. Nothing is stored. Send `content` for the new type to replace
            the slide, or create a new slide of that type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/SlideLocked'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      operationId: deleteSlide
      tags:
        - Slides
      summary: Delete a slide
      description: Removes a slide from the presentation. Cannot delete the last slide.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
        - name: slideId
          in: path
          required: true
          description: Slide ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Slide deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      slideCount:
                        type: integer
                      revision:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/SlideLocked'
        '429':
          $ref: '#/components/responses/RateLimited'

  /presentations/{id}/slides/reorder:
    post:
      operationId: reorderSlides
      tags:
        - Slides
      summary: Reorder slides
      description: Reorders slides in the presentation according to the provided ID array.
      parameters:
        - name: id
          in: path
          required: true
          description: Presentation ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - slideIds
              properties:
                slideIds:
                  type: array
                  items:
                    type: string
                  description: Ordered array of slide IDs
      responses:
        '200':
          description: Slides reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  slides:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        index:
                          type: integer
                  presentation:
                    type: object
                    properties:
                      id:
                        type: string
                      revision:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
